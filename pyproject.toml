[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nebulara"
version = "2.0.1"
description = "Nebulara - AI-native universal programming language"
readme = "README.md"
license = {text = "UNLICENSED"}
requires-python = ">=3.8"
authors = [{name = "CodurraLabs"}]
keywords = ["compiler", "programming-language", "ai-native"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
]
urls = {Repository = "https://github.com/CODURRALABS/NEBULARA"}

[project.scripts]
neb = "nebulara:cli"
nebulara = "nebulara:cli"

[project.files]
"nebulara" = "nebulara_cli.py"
