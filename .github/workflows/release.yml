name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: gcc -static -O2 Compiler/nbs-bootstrap.c -o nebulara.exe -lm
      - name: Build CLI
        run: gcc -static -O2 Compiler/nbs_cli.c -o neb-cli.exe -lm
      - name: Smoke test
        run: .\nebulara.exe --version
      - name: Package
        run: Compress-Archive -Path nebulara.exe,neb-cli.exe -DestinationPath nebulara-${{ github.ref_name }}-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: nebulara-${{ github.ref_name }}-win-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: gcc -static -O2 Compiler/nbs-bootstrap.c -o nebulara -lm
      - name: Build CLI
        run: gcc -static -O2 Compiler/nbs_cli.c -o neb-cli -lm
      - name: Smoke test
        run: ./nebulara --version
      - name: Package
        run: tar czf nebulara-${{ github.ref_name }}-linux-x64.tar.gz nebulara neb-cli
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: nebulara-${{ github.ref_name }}-linux-x64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: gcc -O2 Compiler/nbs-bootstrap.c -o nebulara -lm
      - name: Build CLI
        run: gcc -O2 Compiler/nbs_cli.c -o neb-cli -lm
      - name: Smoke test
        run: ./nebulara --version
      - name: Package
        run: tar czf nebulara-${{ github.ref_name }}-macos-x64.tar.gz nebulara neb-cli
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: nebulara-${{ github.ref_name }}-macos-x64.tar.gz

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            codurralabs/nebulara:latest
            codurralabs/nebulara:${{ github.ref_name }}

  release:
    needs: [build-windows, build-linux, build-macos, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            win-x64/*
            linux-x64/*
            macos-x64/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi-publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install build twine
      - run: python -m build
      - run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  cargo-publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
