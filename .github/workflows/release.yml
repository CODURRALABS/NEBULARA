name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: gcc -static -O2 Compiler/nbs-bootstrap.c -o nebulara.exe -lm
      - name: Build CLI
        run: gcc -static -O2 Compiler/nbs_cli.c -o neb-cli.exe -lm
      - name: Smoke test
        run: .\nebulara.exe --version
      - name: Package
        run: Compress-Archive -Path nebulara.exe,neb-cli.exe -DestinationPath nebulara-${{ github.ref_name }}-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: nebulara-${{ github.ref_name }}-win-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: gcc -static -O2 Compiler/nbs-bootstrap.c -o nebulara -lm
      - name: Build CLI
        run: gcc -static -O2 Compiler/nbs_cli.c -o neb-cli -lm
      - name: Smoke test
        run: ./nebulara --version
      - name: Package
        run: tar czf nebulara-${{ github.ref_name }}-linux-x64.tar.gz nebulara neb-cli
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: nebulara-${{ github.ref_name }}-linux-x64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: gcc -O2 Compiler/nbs-bootstrap.c -o nebulara -lm
      - name: Build CLI
        run: gcc -O2 Compiler/nbs_cli.c -o neb-cli -lm
      - name: Smoke test
        run: ./nebulara --version
      - name: Package
        run: tar czf nebulara-${{ github.ref_name }}-macos-x64.tar.gz nebulara neb-cli
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: nebulara-${{ github.ref_name }}-macos-x64.tar.gz

  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/codurralabs/nebulara:latest
            ghcr.io/codurralabs/nebulara:${{ github.ref_name }}
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            codurralabs/nebulara:latest
            codurralabs/nebulara:${{ github.ref_name }}

  release:
    needs: [build-windows, build-linux, build-macos, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            win-x64/*
            linux-x64/*
            macos-x64/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
